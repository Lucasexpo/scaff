<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="0.1">
<title>Min app</title>
<style>
:root{--bg:#F4F1EC;--card:#FFFFFF;--ink:#1F1D1B;--muted:#77706A;--accent:#3B5BDB}
@media (prefers-color-scheme:dark){:root{--bg:#141312;--card:#1F1D1B;--ink:#F2EEE8;--muted:#A39C95;--accent:#8EA6FF}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;padding:24px}
.card{background:var(--card);border-radius:24px;padding:40px 28px;max-width:420px;width:100%;text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.08)}
.dot{width:56px;height:56px;border-radius:50%;background:var(--accent);margin:0 auto 20px}
h1{font-size:32px;margin:0 0 8px}
p{color:var(--muted);font-size:17px;line-height:1.5;margin:0}
</style>
</head>
<body>
<main class="card">
  <div class="dot"></div>
  <h1>Kommer snart</h1>
  <p>Hvis du ser denne siden, er appen publisert og alt fungerer. Neste steg er å bytte ut denne filen med den ekte appen.</p>
</main>
</body>
</html>

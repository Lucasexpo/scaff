<style>
:root{
  --bg:#EFE8DC; --card:#F8F4EC; --ink:#1F2A36; --muted:#6F6A62; --line:#DDD3C2;
  --acc:#1F3D2E; --acc-ink:#EFE6D2; --soft:#F2E3DA; --wine:#8C3B3B;
  --ok:#3E6B4F; --ok-soft:#E3E8DA; --blue:#1C2A44; --blue-soft:#DCE6EB; --gold:#B9865A; --gold-soft:#F3E7D6;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14181D; --card:#1C2127; --ink:#EDE6D8; --muted:#A49D90; --line:#2D343C;
    --acc:#2E5A43; --acc-ink:#EFE6D2; --soft:#2B2122; --wine:#C9787A;
    --ok:#7FAE8D; --ok-soft:#1D2A23; --blue:#B9CFD9; --blue-soft:#1D2833; --gold:#D4A67C; --gold-soft:#2A231C;
  }
}
:root[data-theme="dark"]{
  --bg:#14181D; --card:#1C2127; --ink:#EDE6D8; --muted:#A49D90; --line:#2D343C;
  --acc:#2E5A43; --acc-ink:#EFE6D2; --soft:#2B2122; --wine:#C9787A;
  --ok:#7FAE8D; --ok-soft:#1D2A23; --blue:#B9CFD9; --blue-soft:#1D2833; --gold:#D4A67C; --gold-soft:#2A231C;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) input[type=time],:root:not([data-theme="light"]) input[type=date]{color-scheme:dark}}
:root[data-theme="dark"] input[type=time],:root[data-theme="dark"] input[type=date]{color-scheme:dark}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(110px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.brand{font-weight:800;font-size:24px;letter-spacing:-.02em}
.brand span{color:var(--acc)}
.tag{font-size:13px;color:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
h1{font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:18px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
.card h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:700}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{min-height:38px;padding:6px 14px;font-size:15px}
.btn.wide{width:100%}
.btn.danger{background:#B3261E;border-color:#B3261E;color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;min-height:40px;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
input[type=text],input[type=number],input[type=time],input[type=date],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:17px}
textarea{min-height:96px;resize:vertical}
label.f{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
.hint{font-size:14px;color:var(--muted);margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:14px;padding:10px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
.bars{list-style:none;margin:0;padding:0}
.bars li{margin:0 0 10px}
.bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;margin-top:4px}
.bar b{display:block;height:100%;border-radius:5px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:none}
.timer{font-size:56px;font-weight:800;letter-spacing:-.03em;text-align:center;margin:6px 0 2px}
.quip{text-align:center;color:var(--muted);font-size:15px;margin:0 0 14px}
.banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:16px;padding:12px 14px;margin-top:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:22px;font-weight:700;padding:24px 16px;border-radius:20px;background:var(--blue-soft);border:1px solid var(--line);margin-top:12px}
.flash .ans{font-size:18px;font-weight:500;margin-top:14px;color:var(--ink)}
.scale{display:flex;gap:8px}
.scale button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.scale button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.step{display:flex;align-items:center;gap:12px}
.step button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:700}
.step .v{font-size:28px;font-weight:800;min-width:48px;text-align:center}
.money{background:var(--soft);border-radius:16px;padding:14px;margin-top:12px}
.money .big{color:var(--acc)}
.cmp{list-style:none;margin:10px 0 0;padding:0}
.cmp li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.cmp li:last-child{border:none}
.challenge{background:var(--ok-soft);border-radius:16px;padding:14px;margin-top:12px}
.challenge b{font-size:20px}
.gate{background:var(--bg);border-radius:16px;padding:16px;text-align:center}
.tips{margin:8px 0 0;padding-left:20px}
.tips li{margin:6px 0}
.x{background:none;border:none;color:var(--muted);font-size:22px;width:36px;height:36px}
svg.chart{width:100%;height:auto;display:block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:none;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--muted);min-height:62px}
nav.tabs button svg{width:24px;height:24px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cgrid .wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0 6px;letter-spacing:.04em}
.cday{border:none;background:none;color:inherit;border-radius:10px;padding:6px 0 5px;min-height:50px;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;cursor:pointer}
.cday .n{font-size:15px;font-weight:600;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.cday.out{opacity:.3}
.cday.today .n{border:1.5px solid var(--acc)}
.cday.sel{background:var(--soft)}
.cday.sealed .n{background:var(--wine);color:#f5ecdc}
.cdots{display:flex;gap:3px;height:6px}
.cdots i{width:6px;height:6px;border-radius:50%;display:block}
.clegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--muted)}
.clegend span{display:flex;align-items:center;gap:6px}
.clegend i{width:8px;height:8px;border-radius:50%;display:block}
nav.tabs button span{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
@media (max-width:380px){nav.tabs button span{font-size:11.5px;letter-spacing:0!important}}
nav.tabs button{padding-left:2px;padding-right:2px}
nav.tabs button.on{color:var(--acc);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:30;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
.modal.open{display:flex}
.modal .sheet{background:var(--card);border-radius:24px;padding:22px 18px;max-width:540px;width:100%;max-height:88vh;overflow-y:auto}
.modal h3{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}
.upd{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));max-width:536px;margin:0 auto;display:none;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px 10px 16px;z-index:50}
.upd.show{display:flex}
.upd button{border:none;border-radius:999px;background:var(--acc);color:#fff;font-weight:700;padding:9px 16px}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}

/* ---- Scaff: skredderstil ---- */
html{min-height:100%;background:var(--bg)}
body{min-height:100vh;min-height:100dvh;min-height:calc(100% + env(safe-area-inset-top,0px));overscroll-behavior-y:none}
.wrap{min-height:100vh;min-height:100dvh}
nav.tabs{transform:translateZ(0)}
.statusbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--acc);z-index:60;pointer-events:none}
h1{font-family:var(--serif);font-weight:600;font-size:34px;letter-spacing:0;line-height:1.05}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:500;font-size:17px;letter-spacing:.32em;text-transform:uppercase}
.brand svg{width:34px;height:34px;flex:none}
.tag{font-family:var(--serif);font-style:normal;font-size:14px;letter-spacing:0;margin-top:2px}
.sub{font-family:var(--serif);font-style:normal;font-size:17px;font-weight:500}
.card{border-radius:8px}
.card h2{font-size:12px;letter-spacing:.18em;font-weight:600}
.big,.timer,.stat b,.step .v{font-family:var(--serif);font-weight:500;letter-spacing:0}
.stat{border-radius:6px}
.btn{border-radius:6px;font-weight:600;letter-spacing:.02em}
.btn.acc{color:var(--acc-ink)}
.chip{border-radius:6px}
.scale button{border-radius:6px;font-family:var(--serif);font-weight:500;font-size:18px}
.scale button.on{color:var(--acc-ink)}
.quip{font-family:var(--serif);font-style:normal;font-size:17px;font-weight:500}
.flash{border-radius:8px;font-family:var(--serif);font-weight:500;font-size:24px}
.money .big{color:var(--wine)}
.money,.challenge,.banner,.gate{border-radius:8px}
.modal .sheet{border-radius:12px}
.modal h3{font-family:var(--serif);font-weight:600;font-size:28px}
.toast{border-radius:6px;font-family:var(--serif);font-style:normal}
.upd{border-radius:8px}.upd button{border-radius:6px;color:var(--acc-ink)}
nav.tabs button{letter-spacing:.04em}
.foot{font-family:var(--serif);font-style:normal;font-size:14px}
.seal{display:block;margin:6px auto 0;width:88px;height:88px;transform:rotate(-8deg)}
.sealrow{display:flex;align-items:center;gap:14px;margin-top:12px}
.sealrow .seal{margin:0;width:64px;height:64px;flex:none}
.sealrow p{margin:0;font-family:var(--serif);font-style:normal;font-size:17px;font-weight:500}

.welcome{position:fixed;inset:0;z-index:45;background:var(--acc);color:var(--acc-ink);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(28px + env(safe-area-inset-top,0px)) 26px calc(28px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.welcome.open{display:flex}
.welcome h2{font-family:var(--serif);font-weight:600;font-size:36px;margin:8px 0 6px;line-height:1.08}
.welcome p{max-width:340px;margin:8px auto 0;font-size:17px;line-height:1.45;opacity:.92}
.welcome .lead{font-family:var(--serif);font-style:normal;font-size:20px;opacity:1;font-weight:500}
.welcome .fine{font-size:14px;opacity:.75}
.wmono{width:124px;height:124px;color:var(--acc-ink);margin-bottom:4px}
.wseal{width:96px;height:96px;transform:rotate(-8deg);margin-bottom:4px}
.wbtn{display:block;margin-left:auto;margin-right:auto;background:var(--acc-ink);color:var(--acc);border:none;border-radius:6px;min-height:52px;padding:12px 28px;font-weight:700;font-size:17px;margin-top:24px;min-width:230px}
.wbtn.ghost{background:transparent;color:var(--acc-ink);border:1px solid rgba(239,230,210,.5);margin-top:12px}
.wlink{display:block;margin-left:auto;margin-right:auto;background:none;border:none;color:var(--acc-ink);opacity:.75;text-decoration:underline;text-underline-offset:3px;margin-top:16px;font-size:15px;padding:6px}
.wopt{display:block;width:100%;max-width:340px;margin:12px auto 0;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(239,230,210,.35);color:var(--acc-ink);border-radius:8px;padding:14px 16px}
.wopt.on{background:var(--acc-ink);color:var(--acc)}
.wopt b{display:block;font-family:var(--serif);font-weight:500;font-size:21px}
.wopt span{font-size:14px;opacity:.85}
.wrowi{display:flex;gap:14px;align-items:flex-start;text-align:left;max-width:340px;margin:18px auto 0}
.wrowi svg{flex:none;width:28px;height:28px;margin-top:2px}
.wrowi b{display:block;font-family:var(--serif);font-weight:500;font-size:20px}
.wrowi span{font-size:15px;opacity:.88;line-height:1.4}
.wlangs{display:flex;flex-wrap:wrap;gap:2px 14px;justify-content:center;max-width:320px;margin:16px auto 0}.wlangs .wlink{display:inline-block;margin:0;padding:4px 2px}.wlangs .wlink.on{opacity:1;font-weight:700;text-decoration:none}
.wdots{display:flex;gap:8px;justify-content:center;margin-top:26px}
.wdots i{width:7px;height:7px;border-radius:50%;border:1px solid var(--acc-ink)}
.wdots i.on{background:var(--acc-ink)}
@keyframes wIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wstep{animation:wIn .35s ease both;width:100%}

/* ---- 3.2: ingen kursiv, kraftigere tall, tydeligere småskrift ---- */
*,*::before,*::after{font-style:normal!important}
.big,.timer,.stat b,.step .v,.scale button,.money .big{font-family:var(--font);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big{font-size:42px}.timer{font-size:54px}.stat b{font-size:24px}
.tag{font-family:var(--font);font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
.sub{font-family:var(--font);font-size:15px;letter-spacing:.01em}
.hint,.small{font-size:15px}
.stat span{font-size:14px}
.quip{font-family:var(--serif);font-size:18px}
.foot{font-family:var(--font);font-size:13px}
.toast{font-family:var(--font);font-weight:600}
.sealrow p{font-family:var(--serif);font-size:18px}
.welcome .lead{font-size:21px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="statusbar" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="var(--acc)"/><circle cx="50" cy="50" r="31" fill="none" stroke="var(--acc-ink)" stroke-width="2.4"/><circle cx="50" cy="50" r="26" fill="none" stroke="var(--acc-ink)" stroke-width="1"/><text x="50" y="64" text-anchor="middle" font-family="Bodoni Moda,Didot,Bodoni 72,Georgia,serif" font-weight="500" font-size="42" fill="var(--acc-ink)">S</text></svg><div>Scaff<div class="tag">Struktur, med stil.</div></div></div>
    <button class="icon-btn" data-act="settings" aria-label="Innstillinger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Hovedmeny"><div class="in" id="tabs"></div></nav>
<div class="upd" id="upd" role="status"><span>Ny versjon er klar.</span><button type="button">Oppdater</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="welcome" id="welcome" role="dialog" aria-modal="true"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
/* ---------- lagring (bare på denne enheten) ---------- */
const KEY="stillas.v1";
const blank=()=>({wins:[],boss:[],todos:[],days:{},subjects:[],sessions:[],cards:[],weeks:{},timer:null,settings:{drinkPrice:120,adult:false}});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||blank();}catch(e){S=blank();}
S=Object.assign(blank(),S);S.settings=Object.assign(blank().settings,S.settings||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let toastT;function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),1800);}

/* ---------- hjelpere ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
function weekNo(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7);}

function detectLang(){const L=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||""]).map(x=>String(x).toLowerCase());for(const l of L){const p=l.slice(0,2);if(p==="nb"||p==="nn"||p==="no")return "nb";if(LANGS[p])return p;}return "en";}

function trCore(t){
  const D=L10N[LANG()];const v=D&&D[t]!==undefined?D[t]:EN[t];
  if(v!==undefined)return dec(v);
  for(const [re,f] of RE){const m=t.match(re);if(m){const r=f(...m);if(r!==t)return dec(r);}}
  if(t.includes(" · ")){return t.split(" · ").map(trCore).join(" · ");}
  if(t.includes(", ")){const p=t.split(", "),q=p.map(trCore);if(q.some((x,i)=>x!==p[i]))return q.join(", ");}
  return /^[\d\s,.%+\/−×:-]+(kr|kg|km|min|%)?$/.test(t)?dec(t):t;
}
function dec(s){return LANG()==="en"?s.replace(/(\d),(\d)/g,"$1.$2"):s;}
function tr(s){if(LANG()==="nb"||!s)return s;const t=s.trim();if(!t)return s;const r=trCore(t);return r===t?s:s.replace(t,r);}

  const n1=x=>x.toFixed(1).replace(".",","),out=[];

  pair(logged.filter(x=>x.tr),logged.filter(x=>!x.tr),x=>x.study,15,v=>hm(v),(a,b)=>`Du studerte <b>${a}</b> på treningsdager, og <b>${b}</b> ellers.`);
  pair(logged.filter(x=>x.d.water===2),logged.filter(x=>x.d.water===0),x=>x.d.energyPm,.4,n1,(a,b)=>`Dager du drakk nok vann, var energien <b>${a}</b>. Dager med for lite <b>${b}</b>.`);

/* ---------- KALENDER ---------- */
function calOcc(from,to){const out={},add=(k,o)=>{(out[k]=out[k]||[]).push(o);};
  S.todos.forEach(x=>{
    if(x.done){if(x.doneAt&&x.doneAt>=from&&x.doneAt<=to)add(x.doneAt,{x,done:true});return;}
    let d=parse(x.due),n=0;
    while(iso(d)<=to&&n<80){const k=iso(d);if(k>=from)add(k,{x,proj:n>0});if(!x.repeat)break;
      d=x.repeat==="month"?new Date(d.getFullYear(),d.getMonth()+1,d.getDate()):addDays(d,x.repeat==="2week"?14:7);n++;}
  });return out;}
function dayInfo(k){const d=S.days[k]||{},goals=d.goals||[],ws=d.workouts||[];
  const ss=S.sessions.filter(s=>iso(new Date(s.start))===k);
  return {d,goals,ws,ss,sealed:goals.length>0&&goals.every(g=>g.done),gdone:goals.filter(g=>g.done).length};}
function vCal(){
  const t0=today(),tk=iso(t0),m=U.cmon||new Date(t0.getFullYear(),t0.getMonth(),1);
  const sel=U.csel||tk,first=monday(m),last=addDays(first,41);
  const occ=calOcc(iso(first),iso(last));
  let cells=["Ma","Ti","On","To","Fr","Lø","Sø"].map(w=>`<div class="wd">${w}</div>`).join("");
  for(let i=0;i<42;i++){const dt=addDays(first,i),k=iso(dt);
    if(i===35&&dt.getMonth()!==m.getMonth())break;
    const I=dayInfo(k),o=(occ[k]||[]).filter(e=>!e.done);
    const dots=[I.ws.length?"var(--ok)":"",I.ss.length?"var(--blue)":"",o.length?"var(--gold)":""].filter(Boolean).map(c=>`<i style="background:${c}"></i>`).join("");
    const cls=["cday",dt.getMonth()!==m.getMonth()?"out":"",k===tk?"today":"",k===sel?"sel":"",I.sealed?"sealed":""].filter(Boolean).join(" ");
    cells+=`<button class="${cls}" data-act="csel" data-v="${k}" aria-label="${k}"><span class="n">${dt.getDate()}</span><span class="cdots">${dots}</span></button>`;}
  const mn=m.toLocaleDateString(LOC(),{month:"long",year:"numeric"});
  const I=dayInfo(sel),sd=parse(sel),past=sel<=tk,items=occ[sel]||[];
  const lines=[];
  if(I.goals.length)lines.push(`<li class="row between" style="flex-wrap:nowrap"><span><b>${I.sealed?"Forseglet":"Mål"}</b></span><span class="muted">${I.gdone} / ${I.goals.length}</span></li>`);
  I.ws.forEach(w=>{const L=wLine(w,sel);lines.push(`<li><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px"></span>${esc(L.main)}</li>`);});
  if(I.ss.length){const by={};I.ss.forEach(x=>by[x.sub]=(by[x.sub]||0)+x.min);
    Object.keys(by).forEach(sb=>lines.push(`<li class="row between" style="flex-wrap:nowrap"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:8px"></span>${esc(subj(sb).name)}</span><span class="muted">${hm(by[sb])}</span></li>`));}
  const real=items.filter(e=>!e.proj).map(e=>e.x),proj=items.filter(e=>e.proj).map(e=>e.x);
  let html=`<h1>Kalender</h1><p class="sub">Hele måneden på ett blikk.</p>
  <div class="card">
    <div class="row between" style="flex-wrap:nowrap;margin-bottom:8px">
      <button class="x" data-act="cmon" data-v="-1" aria-label="Forrige måned" style="display:grid;place-items:center"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button data-act="ctoday" style="border:none;background:none;color:inherit;font-family:var(--serif);font-size:22px;font-weight:600;text-transform:capitalize;cursor:pointer">${mn}</button>
      <button class="x" data-act="cmon" data-v="1" aria-label="Neste måned" style="display:grid;place-items:center"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="cgrid">${cells}</div>
    <div class="clegend"><span><i style="background:var(--wine)"></i>Alle mål nådd</span><span><i style="background:var(--ok)"></i>Trening</span><span><i style="background:var(--blue)"></i>${STITLE()}</span><span><i style="background:var(--gold)"></i>Huske</span></div>
  </div>
  <div class="card"><h2 style="text-transform:capitalize">${sd.toLocaleDateString(LOC(),{weekday:"long",day:"numeric",month:"long"})}</h2>
    ${lines.length?`<ul class="list">${lines.join("")}</ul>`:(past?`<p class="hint" style="margin-top:0">Ingenting logget denne dagen.</p>`:"")}
    ${real.length?`<h2 style="margin-top:16px">Huske</h2><ul class="list">${real.map(x=>todoItem(x)).join("")}</ul>`:""}
    ${proj.length?`<h2 style="margin-top:16px">Gjentas</h2><ul class="list">${proj.map(x=>`<li class="row" style="flex-wrap:nowrap"><span class="muted" style="margin-right:8px">↻</span>${esc(L10(x.t))}${x.time?`<span class="muted" style="margin-left:auto">kl. ${x.time}</span>`:""}</li>`).join("")}</ul>`:""}
    ${past?`<button class="btn ghost small" style="margin-top:12px" data-act="copen" data-v="${sel}">Åpne dagen</button>`:""}

      <label class="f">Klokkeslett (valgfritt)</label><input type="time" id="cTime" style="max-width:160px">`:""}
  </div>`;
  return html+foot();
}

function notesToCards(sub,txt){
  let n=0;(txt||"").split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const m=l.match(/^(.+?)\s*[:–—-]\s+(.+)$/)||l.match(/^(.+?):\s*(.+)$/);
    S.cards.push({id:uid(),sub,front:m?m[1]:l,back:m?m[2]:"",known:false,created:Date.now()});n++;});
  return n;
}

function challenge(w,dd,units){

  else if(dd===1){t="Gå en tur på 30 minutter";why="Én kveld ute, én tur ute. Balanse.";}
  else{t="Hold det gående: 30 minutter bevegelse";why="Rolig helg? Da har du overskudd. Bruk det.";}
  return `<div class="challenge"><div class="small muted">Ukas utfordring</div><b>${t}</b><p class="small" style="margin:6px 0 10px">${why}</p>

}

function ics(kind){

    "DTSTART:"+dt,"DURATION:PT10M",eve?"RRULE:FREQ=DAILY":"RRULE:FREQ=WEEKLY;BYDAY=SU","SUMMARY:"+sum,"DESCRIPTION:"+desc+" "+url,"URL:"+url,

}

  if(a==="gadd"){const i=document.getElementById("gIn"),t=i&&i.value.trim();if(!t){toast("Skriv et mål først");return;}const d=dayData(iso(U.day));if(d.goals.length>=5)return;d.goals.push({t,done:false});save();render();const n=document.getElementById("gIn");if(n)n.focus();return;}
  if(a==="gdel"){const d=dayData(iso(U.day));d.goals.splice(+v,1);save();render();return;}
  if(a==="gdone"){const d=dayData(iso(U.day)),g=d.goals[+v];g.done=!g.done;save();render();if(g.done&&d.goals.every(x=>x.done))toast("Alle mål nådd. Elegant.");return;}
  if(a==="gmove"){const d=dayData(iso(U.day)),t=dayData(iso(addDays(U.day,1)));const left=d.goals.filter(g=>!g.done);left.forEach(g=>{if(t.goals.length<5&&!t.goals.some(x=>x.t===g.t))t.goals.push({t:g.t,done:false});});save();render();toast(`${left.length} mål flyttet til i morgen`);return;}
  /* fag */
  if(a==="addsub"){addSub();return;}
  if(a==="pickcol"){document.querySelectorAll("#sCol .chip").forEach(c=>c.classList.toggle("on",c===b));return;}
  if(a==="savesub"){const n=document.getElementById("sName").value.trim();if(!n){toast("Faget trenger et navn");return;}
    const c=(document.querySelector("#sCol .chip.on")||{}).dataset;S.subjects.push({id:uid(),name:n,color:c?c.v:COLORS[0]});save();close();render();toast(`${n} er lagt til`);return;}
  if(a==="managesub"){manageSub();return;}
  if(a==="delsub"){if(!confirm(L10("Slette faget med alle økter og kort?")))return;S.subjects=S.subjects.filter(s=>s.id!==v);S.sessions=S.sessions.filter(s=>s.sub!==v);S.cards=S.cards.filter(c=>c.sub!==v);if(S.timer&&S.timer.sub===v)S.timer=null;if(U.drillSub===v)U.drillSub=null;save();manageSub();render();return;}
  /* økter */
  if(a==="pickstart"){document.querySelectorAll("#subPick .chip").forEach(c=>c.classList.toggle("on",c===b));return;}
  if(a==="start"){S.timer={sub:startSub(),startedAt:Date.now()};save();render();toast("Klokken går. Lykke til.");return;}
  if(a==="cancel"){if(!confirm(tr("Avbryte økta uten å lagre?")))return;S.timer=null;save();render();return;}
  if(a==="stop"){const t=S.timer;const m=elapsedMin();if(m<1){toast("Under ett minutt teller dessverre ikke");return;}sessionForm(t.sub,m,true);return;}
  if(a==="manual"){sessionForm(startSub(),45,false);return;}
  if(a==="savesess"){
    const sub=document.getElementById("fSub")?document.getElementById("fSub").value:v;
    const min=b.dataset.min?+b.dataset.min:Math.max(1,+(document.getElementById("fMin").value||0));
    if(!min){toast("Skriv inn antall minutter");return;}
    const start=b.dataset.min&&S.timer?S.timer.startedAt:Date.now()-min*60000;
    const read=document.getElementById("fRead").value.trim(),notes=(document.getElementById("fNotes")||{}).value||"";
    S.sessions.push({id:uid(),sub,start,min,read});
    const n=notesToCards(sub,notes);
    if(b.dataset.min)S.timer=null;
    save();close();render();toast(n?`Lagret, og ${n} nye pugge-kort`:"Lagret. Fremtidige deg sier takk.");return;}
  /* pugg */
  if(a==="drillsub"){U.drillSub=v;U.drill=null;render();return;}
  if(a==="addcard"){const f=document.getElementById("cFront").value.trim(),bk=document.getElementById("cBack").value.trim();if(!f){toast("Kortet trenger et spørsmål");return;}
    S.cards.push({id:uid(),sub:U.drillSub,front:f,back:bk,known:false,created:Date.now()});save();render();toast("Kortet er lagt til");return;}
  if(a==="delcard"){S.cards=S.cards.filter(c=>c.id!==v);save();render();return;}
  if(a==="startdrill"){const cs=S.cards.filter(c=>c.sub===U.drillSub);const todo=cs.filter(c=>!c.known),done=cs.filter(c=>c.known);
    const sh=x=>x.map(c=>[Math.random(),c.id]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);U.drill=sh(todo).concat(sh(done));U.show=false;render();return;}
  if(a==="reveal"){U.show=true;render();return;}
  if(a==="knew"||a==="again"){const id=U.drill.shift(),c=S.cards.find(x=>x.id===id);if(c){c.known=a==="knew";if(a==="again")U.drill.push(id);}save();U.show=false;
    if(!U.drill.length){U.drill=null;toast("Ferdig med bunken. Hjernen din er stolt.");}render();return;}
  if(a==="enddrill"){U.drill=null;render();return;}
  /* søndag */
  if(a==="week"){const n=addDays(U.week,7*+v);if(n<=monday(today())){U.week=n;render();}return;}
  if(a==="thisweek"){U.week=monday(today());render();return;}
  if(a==="scale"){const w=S.weeks[iso(U.week)];const n=+v;w[b.dataset.f]=w[b.dataset.f]===n?undefined:n;save();render();return;}
  if(a==="adult"){S.settings.adult=true;save();render();return;}
  if(a==="hideadult"){S.settings.adult=false;save();close();render();return;}
  if(a==="drink"){const w=S.weeks[iso(U.week)];w.drinkDays=w.drinkDays===+v?undefined:+v;save();render();return;}
  if(a==="unit"){const w=S.weeks[iso(U.week)];w.units=Math.max(0,(w.units||0)+ +v);save();render();return;}
  if(a==="chdone"){const w=S.weeks[iso(U.week)];w.chDone=!w.chDone;save();render();if(w.chDone)toast("Stilig.");return;}
  if(a==="ics"){ics(v);if(v==="eve"){if(document.getElementById("welcome").classList.contains("open"))welcome(U.wstep);else render();}return;}
  /* innstillinger */
  if(a==="theme"){if(v==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",v);try{localStorage.setItem(KEY+".theme",v);}catch(x){}
    document.querySelectorAll('[data-act="theme"]').forEach(c=>c.classList.toggle("on",c===b));return;}
  if(a==="savesettings"){const p=+document.getElementById("pack").value;if(p>0)S.settings.drinkPrice=p;save();close();render();return;}
  if(a==="backup"){backup();return;}
  if(a==="restore"){restore();return;}
  if(a==="doimport"){const t=document.getElementById("impText");if(t&&t.value.trim())doImport(t.value.trim());else toast("Velg en fil eller lim inn teksten");return;}
  if(a==="howto"){howto();return;}
  if(a==="askwipe"){open(`<h3>Slette alt?</h3><p class="muted">Fag, økter, kort og søndagsrapporter forsvinner fra denne telefonen. Det kan ikke angres.</p><div class="row"><button class="btn danger" data-act="wipe">Slett alt</button><button class="btn ghost" data-act="close">Avbryt</button></div>`);return;}
  if(a==="wipe"){S=blank();save();close();U.view="today";render();toast("Alt er slettet");return;}
});
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")close();});
document.addEventListener("input",e=>{if(e.target.id==="tIn")U.tdraft=e.target.value;if(e.target.id==="cIn")U.cdraft=e.target.value;if(e.target.id==="tTime")U.ttime=e.target.value;if(e.target.id==="winIn")U.windraft=e.target.value;if(e.target.id==="bIn")U.bdraft=e.target.value;});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const m={winIn:"winadd",bIn:"badd"}[e.target.id];if(m){const b=document.querySelector(`[data-act="${m}"]`);if(b)b.click();}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="tIn"){const b=document.querySelector('[data-act="tadd"]');if(b)b.click();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close();if(e.key==="Enter"&&e.target.id==="gIn"){const b=document.querySelector('[data-act="gadd"]');if(b)b.click();}});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset&&el.dataset.wbind&&U.wk){U.wk[el.dataset.wbind]=el.value;}if(el.dataset&&el.dataset.wex&&U.wk){const[i,f]=el.dataset.wex.split("|");if(U.wk.ex[+i])U.wk.ex[+i][f]=el.value;}});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset&&el.dataset.dbind){dayData(iso(U.day))[el.dataset.dbind]=el.value;save();}});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset&&el.dataset.bind==="spent"){S.weeks[iso(U.week)].spent=el.value;save();clearTimeout(window._sp);window._sp=setTimeout(render,900);}});
document.addEventListener("change",e=>{if(e.target.id==="impFile"&&e.target.files&&e.target.files[0]){const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(e.target.files[0]);}});
{const lim=iso(addDays(today(),-14));S.todos=(S.todos||[]).filter(x=>!x.done||(x.doneAt||"")>=lim);}
try{const t=localStorage.getItem(KEY+".theme");if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t);}catch(e){}

/* ---------- oppdateringssjekk ---------- */
const MY_VER=(document.querySelector('meta[name="app-version"]')||{}).content||"";let updShown=false;
function checkUpdate(){if(updShown||!/^https?:/.test(location.protocol)||!window.fetch)return;
  fetch(location.pathname+"?sjekk="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{const m=t.match(/<meta name="app-version" content="([^"]+)"/);
    if(m&&m[1]&&m[1]!==MY_VER){updShown=true;const el=document.getElementById("upd");el.dataset.v=m[1];el.classList.add("show");}}).catch(()=>{});}
document.getElementById("upd").addEventListener("click",e=>{if(!e.target.closest("button"))return;save();location.replace(location.pathname+"?v="+encodeURIComponent(document.getElementById("upd").dataset.v||Date.now()));});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){checkUpdate();if(U.view==="study"&&S.timer)render();}});
setTimeout(checkUpdate,1500);

if(today().getDay()===0&&!(S.weeks[iso(monday(today()))]||{}).opened&&S.subjects.length)U.view="sunday";
render();
if(!S.settings.welcomed){const has=S.sessions.length||S.subjects.length||Object.keys(S.days).length;if(has){S.settings.welcomed=true;save();}else welcome(0);}
})();
</script>

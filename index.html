<title>Scaff</title>
<style>
:root{
  --bg:#EFE8DC; --card:#F8F4EC; --ink:#1F2A36; --muted:#6F6A62; --line:#DDD3C2;
  --acc:#1F3D2E; --acc-ink:#EFE6D2; --soft:#F2E3DA; --wine:#8C3B3B;
  --ok:#3E6B4F; --ok-soft:#E3E8DA; --blue:#1C2A44; --blue-soft:#DCE6EB; --gold:#B9865A; --gold-soft:#F3E7D6;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14181D; --card:#1C2127; --ink:#EDE6D8; --muted:#A49D90; --line:#2D343C;
    --acc:#2E5A43; --acc-ink:#EFE6D2; --soft:#2B2122; --wine:#C9787A;
    --ok:#7FAE8D; --ok-soft:#1D2A23; --blue:#B9CFD9; --blue-soft:#1D2833; --gold:#D4A67C; --gold-soft:#2A231C;
  }
}
:root[data-theme="dark"]{
  --bg:#14181D; --card:#1C2127; --ink:#EDE6D8; --muted:#A49D90; --line:#2D343C;
  --acc:#2E5A43; --acc-ink:#EFE6D2; --soft:#2B2122; --wine:#C9787A;
  --ok:#7FAE8D; --ok-soft:#1D2A23; --blue:#B9CFD9; --blue-soft:#1D2833; --gold:#D4A67C; --gold-soft:#2A231C;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(110px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.brand{font-weight:800;font-size:24px;letter-spacing:-.02em}
.brand span{color:var(--acc)}
.tag{font-size:13px;color:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
h1{font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:18px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
.card h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:700}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{min-height:38px;padding:6px 14px;font-size:15px}
.btn.wide{width:100%}
.btn.danger{background:#B3261E;border-color:#B3261E;color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;min-height:40px;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:17px}
textarea{min-height:96px;resize:vertical}
label.f{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
.hint{font-size:14px;color:var(--muted);margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:14px;padding:10px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
.bars{list-style:none;margin:0;padding:0}
.bars li{margin:0 0 10px}
.bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;margin-top:4px}
.bar b{display:block;height:100%;border-radius:5px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:none}
.timer{font-size:56px;font-weight:800;letter-spacing:-.03em;text-align:center;margin:6px 0 2px}
.quip{text-align:center;color:var(--muted);font-size:15px;margin:0 0 14px}
.banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:16px;padding:12px 14px;margin-top:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:22px;font-weight:700;padding:24px 16px;border-radius:20px;background:var(--blue-soft);border:1px solid var(--line);margin-top:12px}
.flash .ans{font-size:18px;font-weight:500;margin-top:14px;color:var(--ink)}
.scale{display:flex;gap:8px}
.scale button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.scale button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.step{display:flex;align-items:center;gap:12px}
.step button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:700}
.step .v{font-size:28px;font-weight:800;min-width:48px;text-align:center}
.money{background:var(--soft);border-radius:16px;padding:14px;margin-top:12px}
.money .big{color:var(--acc)}
.cmp{list-style:none;margin:10px 0 0;padding:0}
.cmp li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.cmp li:last-child{border:none}
.challenge{background:var(--ok-soft);border-radius:16px;padding:14px;margin-top:12px}
.challenge b{font-size:20px}
.gate{background:var(--bg);border-radius:16px;padding:16px;text-align:center}
.tips{margin:8px 0 0;padding-left:20px}
.tips li{margin:6px 0}
.x{background:none;border:none;color:var(--muted);font-size:22px;width:36px;height:36px}
svg.chart{width:100%;height:auto;display:block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:none;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--muted);min-height:62px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--acc);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:30;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
.modal.open{display:flex}
.modal .sheet{background:var(--card);border-radius:24px;padding:22px 18px;max-width:540px;width:100%;max-height:88vh;overflow-y:auto}
.modal h3{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}
.upd{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));max-width:536px;margin:0 auto;display:none;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px 10px 16px;z-index:50}
.upd.show{display:flex}
.upd button{border:none;border-radius:999px;background:var(--acc);color:#fff;font-weight:700;padding:9px 16px}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}

/* ---- Scaff: skredderstil ---- */
h1{font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:0;line-height:1.05}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:500;font-size:17px;letter-spacing:.32em;text-transform:uppercase}
.brand svg{width:34px;height:34px;flex:none}
.tag{font-family:var(--serif);font-style:italic;font-size:14px;letter-spacing:0;margin-top:2px}
.sub{font-family:var(--serif);font-style:italic;font-size:17px}
.card{border-radius:8px}
.card h2{font-size:12px;letter-spacing:.18em;font-weight:600}
.big,.timer,.stat b,.step .v{font-family:var(--serif);font-weight:500;letter-spacing:0}
.stat{border-radius:6px}
.btn{border-radius:6px;font-weight:600;letter-spacing:.02em}
.btn.acc{color:var(--acc-ink)}
.chip{border-radius:6px}
.scale button{border-radius:6px;font-family:var(--serif);font-weight:500;font-size:18px}
.scale button.on{color:var(--acc-ink)}
.quip{font-family:var(--serif);font-style:italic;font-size:17px}
.flash{border-radius:8px;font-family:var(--serif);font-weight:500;font-size:24px}
.money .big{color:var(--wine)}
.money,.challenge,.banner,.gate{border-radius:8px}
.modal .sheet{border-radius:12px}
.modal h3{font-family:var(--serif);font-weight:400;font-size:28px}
.toast{border-radius:6px;font-family:var(--serif);font-style:italic}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="var(--acc)"/><circle cx="50" cy="50" r="31" fill="none" stroke="var(--acc-ink)" stroke-width="2.4"/><circle cx="50" cy="50" r="26" fill="none" stroke="var(--acc-ink)" stroke-width="1"/><text x="50" y="64" text-anchor="middle" font-family="Bodoni Moda,Didot,Bodoni 72,Georgia,serif" font-weight="500" font-size="42" fill="var(--acc-ink)">S</text></svg><div>Scaff<div class="tag">Struktur, med stil.</div></div></div>
    <button class="icon-btn" data-act="settings" aria-label="Innstillinger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Hovedmeny"><div class="in" id="tabs"></div></nav>
<div class="upd" id="upd" role="status"><span>Ny versjon er klar.</span><button type="button">Oppdater</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
/* ---------- lagring (bare på denne enheten) ---------- */
const KEY="stillas.v1";
const blank=()=>({days:{},subjects:[],sessions:[],cards:[],weeks:{},timer:null,settings:{packPrice:150,adult:false}});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||blank();}catch(e){S=blank();}
S=Object.assign(blank(),S);S.settings=Object.assign(blank().settings,S.settings||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let toastT;function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),1800);}

/* ---------- hjelpere ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
function weekNo(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7);}
const fmtShort=d=>d.toLocaleDateString("nb-NO",{day:"numeric",month:"short"}).replace(".","");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const kr=n=>Math.round(n).toLocaleString("nb-NO")+" kr";
const hm=min=>{min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h?`${h} t ${m} min`:`${m} min`;};
const COLORS=["#FF5A36","#3557E8","#1F9D63","#E9A800","#9B4DE0","#E0457B","#0FA3B1","#7A6A58"];
const subj=id=>S.subjects.find(s=>s.id===id)||{name:"Ukjent fag",color:"#999"};
const pick=a=>a[Math.floor(Math.random()*a.length)];

const U={view:"today",day:today(),part:null,week:monday(today()),drill:null,drillSub:null,show:false};

/* ---------- ikoner og faner ---------- */
const ICONS={
 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 18h18"/><path d="M6 18a6 6 0 0 1 12 0"/><path d="M12 6V3M5.6 9.6 3.5 7.5M18.4 9.6l2.1-2.1"/></svg>',
 study:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>',
 drill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2.5"/><path d="M7 3h11a3 3 0 0 1 3 3v11"/></svg>',
 sunday:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
};
const TABS=[["today","I dag"],["study","Studie"],["drill","Pugg"],["sunday","Søndag"]];
function renderTabs(){document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button data-act="tab" data-v="${k}" class="${U.view===k?"on":""}" ${U.view===k?'aria-current="page"':""}>${ICONS[k]}<span>${l}</span></button>`).join("");}
function render(){renderTabs();document.getElementById("view").innerHTML=({today:vToday,study:vStudy,drill:vDrill,sunday:vSunday})[U.view]();}

/* ---------- statistikk ---------- */
const sessIn=(from,to)=>S.sessions.filter(s=>s.start>=from.getTime()&&s.start<to.getTime());
const sumMin=a=>a.reduce((t,s)=>t+s.min,0);
function streak(){
  const days=new Set(S.sessions.map(s=>iso(new Date(s.start))));
  let d=today();if(!days.has(iso(d)))d=addDays(d,-1);
  let n=0;while(days.has(iso(d))){n++;d=addDays(d,-1);}return n;
}
function weekBars(n){
  const m=monday(today()),out=[];
  for(let i=n-1;i>=0;i--){const a=addDays(m,-7*i);out.push({w:a,min:sumMin(sessIn(a,addDays(a,7)))});}
  return out;
}
function chart(data){
  const W=320,H=130,L=6,R=6,T=10,B=22,mx=Math.max(60,...data.map(d=>d.min)),bw=(W-L-R)/data.length*.6;
  let g="";
  data.forEach((d,i)=>{const cx=L+(i+.5)*(W-L-R)/data.length,h=Math.max(d.min/mx*(H-T-B),d.min?3:1.5),last=i===data.length-1;
    g+=`<rect x="${cx-bw/2}" y="${H-B-h}" width="${bw}" height="${h}" rx="${Math.min(6,bw/2)}" fill="${last?"var(--acc)":"var(--line)"}"/>`;
    g+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">u${weekNo(d.w)}</text>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Studietid per uke">${g}</svg>`;
}



/* lakksegl */
const SEAL=(cls="seal")=>`<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8c8 0 10 5 17 6s12 7 12 14 4 9 4 16-4 10-4 17-6 12-12 14-9 6-17 6-10-5-17-6-12-7-12-14-4-10-4-17 4-9 4-16 6-13 12-14 9-6 17-6z" fill="#7A2E2E"/><circle cx="50" cy="51" r="25" fill="#8C3B3B"/><circle cx="50" cy="51" r="25" fill="none" stroke="#65222A" stroke-width="1.6"/><circle cx="50" cy="51" r="20" fill="none" stroke="#6E2A30" stroke-width=".8"/><text x="50" y="64" text-anchor="middle" font-family="Bodoni Moda,Didot,Bodoni 72,Georgia,serif" font-weight="500" font-size="34" fill="#E9C9A8">S</text><path d="M30 26c4-3 9-4 13-4" stroke="#A85454" stroke-width="2" stroke-linecap="round" opacity=".7" fill="none"/></svg>`;
/* ---------- I DAG ---------- */
const SLEEP=["Elendig","Dårlig","Grei","God","Supert"], ENERGY=["Tom","Lav","Middels","God","Full"], MOOD=["Tung","Lav","Grei","God","Topp"];
const AM_QUIPS=["Ny dag, blanke ark. Ikke søl på dem med en gang.","En god dag er som en god dress: den sitter fordi den er planlagt.","Tre mål. Ikke tolv. Du er ikke en to-do-liste.","Planen trenger ikke være perfekt. Den trenger å finnes."];
const PM_QUIPS=["Dagen er over. Vær ærlig, men snill.","Sjekk av det du fikk til. Resten flytter vi.","Kveldsrapport. Ingen dommer i salen."];
const dayData=k=>{const d=S.days[k]||(S.days[k]={});d.goals=d.goals||[];return d;};
function dscale(f,val,labels){return `<div class="scale">${labels.map((l,i)=>`<button class="${val===i+1?"on":""}" data-act="dscale" data-f="${f}" data-v="${i+1}" aria-pressed="${val===i+1}" title="${l}">${i+1}</button>`).join("")}</div><div class="row between small muted" style="margin-top:4px"><span>${labels[0]}</span><span>${val?labels[val-1]:""}</span><span>${labels[4]}</span></div>`;}
function dtext(f,val,ph){return `<input type="text" data-dbind="${f}" value="${esc(val||"")}" placeholder="${ph}">`;}
function vToday(){
  const k=iso(U.day), d=S.days[k]||{}, goals=d.goals||[], isToday=k===iso(today());
  const part=U.part||(isToday&&new Date().getHours()<15?"am":"pm");
  const amDone=!!(d.sleep||d.energyAm||goals.length), pmDone=!!(d.mood||d.energyPm||d.win);
  const done=goals.filter(g=>g.done).length;
  const dayName=U.day.toLocaleDateString("nb-NO",{weekday:"long",day:"numeric",month:"long"});
  let html=`<h1>${isToday?(part==="am"?"God morgen":"God kveld"):"Tilbake i tid"}</h1><p class="sub">${dayName.charAt(0).toUpperCase()+dayName.slice(1)}</p>
  <div class="row between">
    <button class="icon-btn" data-act="day" data-v="-1" aria-label="Forrige dag">‹</button>
    <div class="chips"><button class="chip ${part==="am"?"on":""}" data-act="part" data-v="am">☀ Morgen${amDone?" ✓":""}</button><button class="chip ${part==="pm"?"on":""}" data-act="part" data-v="pm">☾ Kveld${pmDone?" ✓":""}</button></div>
    <button class="icon-btn" data-act="day" data-v="1" aria-label="Neste dag" ${isToday?'disabled style="opacity:.3"':""}>›</button>
  </div>
  ${isToday?"":`<div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost small" data-act="gotoday">Til i dag</button></div>`}`;
  if(part==="am"){
    html+=`<p class="quip" style="margin-top:14px">${pick(AM_QUIPS)}</p>
    <div class="card"><h2>Hvordan sov du?</h2>${dscale("sleep",d.sleep,SLEEP)}
      <h2 style="margin-top:16px">Energi nå</h2>${dscale("energyAm",d.energyAm,ENERGY)}</div>
    <div class="card"><h2>Dagens mål</h2>
      ${goals.length?`<ul class="list">${goals.map((g,i)=>`<li class="row between" style="flex-wrap:nowrap"><span><b class="muted">${i+1}.</b> ${esc(g.t)}</span><button class="x" data-act="gdel" data-v="${i}" aria-label="Fjern mål">×</button></li>`).join("")}</ul>`:`<p class="hint" style="margin-top:0">Hva vil du ha fått gjort når dagen er over? Tre ting holder.</p>`}
      ${goals.length<5?`<div class="row" style="margin-top:10px;flex-wrap:nowrap"><input type="text" id="gIn" placeholder="${goals.length<3?"F.eks. lese kapittel 5":"Ett til? Greit, men ikke mer."}"><button class="btn small" data-act="gadd">Legg til</button></div>`:`<p class="hint">Fem mål er taket. Du er et menneske, ikke en fabrikk.</p>`}</div>
    <div class="card"><h2>Én ting jeg gleder meg til</h2>${dtext("lookfwd",d.lookfwd,"Lunsj, trening, et program, en person …")}</div>
    <button class="btn acc wide" style="margin-top:14px" data-act="part" data-v="pm">Ferdig for nå. Vi ses i kveld.</button>`;
  }else{
    html+=`<p class="quip" style="margin-top:14px">${pick(PM_QUIPS)}</p>
    <div class="card"><h2>Dagens mål${goals.length?` · ${done} av ${goals.length}`:""}</h2>
      ${goals.length?`<div>${goals.map((g,i)=>`<button class="opt-goal row" data-act="gdone" data-v="${i}" aria-pressed="${!!g.done}" style="width:100%;border:none;background:none;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;flex-wrap:nowrap"><span style="flex:none;width:26px;height:26px;border-radius:8px;border:2px solid ${g.done?"var(--ok)":"var(--line)"};background:${g.done?"var(--ok)":"transparent"};color:#fff;display:grid;place-items:center;font-weight:800">${g.done?"✓":""}</span><span style="${g.done?"text-decoration:line-through;color:var(--muted)":""}">${esc(g.t)}</span></button>`).join("")}</div>
        ${done===goals.length?`<div class="sealrow">${SEAL()}<p>Alle mål nådd. Dagen er forseglet.</p></div>`:`<p class="hint">${done?"Ikke alt, men noe. Det teller.":"Null av "+goals.length+". Morgendagen er en ny sjanse."}</p>`}
        ${done<goals.length&&isToday?`<button class="btn ghost small" style="margin-top:10px" data-act="gmove">Flytt det uferdige til i morgen</button>`:""}`
      :`<p class="hint" style="margin-top:0">Ingen mål satt i morges. Neste gang: trykk på Morgen først.</p>`}</div>
    <div class="card"><h2>Humøret i dag</h2>${dscale("mood",d.mood,MOOD)}
      <h2 style="margin-top:16px">Energi i kveld</h2>${dscale("energyPm",d.energyPm,ENERGY)}</div>
    <div class="card"><h2>Det beste i dag</h2>${dtext("win",d.win,"Stort eller lite, det teller likt")}
      <h2 style="margin-top:16px">Dette tar jeg med til i morgen</h2>${dtext("tomorrow",d.tomorrow,"En lærdom, en ting å gjøre annerledes")}</div>`;
  }
  /* uka i prikker */
  const m=monday(U.day);let dots="";
  for(let i=0;i<7;i++){const dt=addDays(m,i),x=S.days[iso(dt)]||{},am=!!(x.sleep||x.energyAm||(x.goals||[]).length),pm=!!(x.mood||x.energyPm||x.win),fut=dt>today();
    dots+=`<button data-act="goday" data-v="${iso(dt)}" ${fut?"disabled":""} style="border:none;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:4px;${fut?"opacity:.35":""}"><span class="small ${iso(dt)===k?"":"muted"}" style="${iso(dt)===k?"font-weight:800":""}">${["Ma","Ti","On","To","Fr","Lø","Sø"][i]}</span><span style="width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);background:${am?"var(--gold)":"transparent"}"></span><span style="width:14px;height:14px;border-radius:50%;border:2px solid var(--blue);background:${pm?"var(--blue)":"transparent"}"></span></button>`;}
  html+=`<div class="card"><h2>Uka di</h2><div style="display:grid;grid-template-columns:repeat(7,1fr)">${dots}</div><p class="hint">Gul er morgen, blå er kveld. Trykk på en dag for å åpne den.</p></div>`;
  return html+foot();
}

/* ---------- STUDIE ---------- */
const RUN_QUIPS=["Telefonen er nå en bok. Ikke åpne TikTok.","Fokus. Snapene overlever uten deg.","God skreddersøm tar tid. Det gjør kunnskap også.","Hjernen jobber. Ikke forstyrr.","Dette er gratis trening for hodet.","Du er i sonen. Bli der."];
const EMPTY_QUIPS=["Bøkene venter. De er tålmodige, men ikke uendelig.","Ingen økter ennå. Starten er det tyngste, så lover vi at det blir lettere.","Null minutter. Det er bare én vei herfra, og det er opp."];
function elapsedMin(){const t=S.timer;return t?(Date.now()-t.startedAt)/60000:0;}
let tick;
function vStudy(){
  clearInterval(tick);
  const t=S.timer, wk=monday(today()), thisW=sessIn(wk,addDays(wk,7)), lastW=sessIn(addDays(wk,-7),wk);
  const tm=sumMin(thisW), lm=sumMin(lastW), st=streak();
  const isSun=today().getDay()===0, wkKey=iso(wk), seen=(S.weeks[wkKey]||{}).opened;
  let html=`<h1>Studie</h1><p class="sub">Treningsloggen for hodet.</p>`;
  if(isSun&&!seen)html+=`<div class="banner"><span><b>Søndagsrapporten er klar.</b><br><span class="small">Se hvordan uka di ble.</span></span><button class="btn small acc" data-act="tab" data-v="sunday">Åpne</button></div>`;
  if(!S.subjects.length){
    html+=`<div class="card"><h2>Kom i gang</h2><p style="margin-top:0">Legg til fagene dine først. Matte, norsk, historie, lappen, hva som helst.</p><button class="btn acc wide" data-act="addsub">Legg til fag</button></div>`;
    return html+foot();
  }
  if(t){
    tick=setInterval(()=>{const el=document.getElementById("clock");if(el){const s=Math.floor((Date.now()-S.timer.startedAt)/1000);el.textContent=pad(Math.floor(s/3600))+":"+pad(Math.floor(s/60)%60)+":"+pad(s%60);}},1000);
    const s=Math.floor((Date.now()-t.startedAt)/1000);
    html+=`<div class="card"><h2>Pågående økt · ${esc(subj(t.sub).name)}</h2>
      <div class="timer mono" id="clock">${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}</div>
      <p class="quip">${pick(RUN_QUIPS)}</p>
      <div class="row" style="justify-content:center"><button class="btn acc" data-act="stop">Ferdig, lagre økta</button><button class="btn ghost" data-act="cancel">Avbryt</button></div></div>`;
  }else{
    html+=`<div class="card"><h2>Start en økt</h2>
      <div class="chips" id="subPick">${S.subjects.map((s,i)=>`<button class="chip ${i===0?"on":""}" data-act="pickstart" data-v="${s.id}"><i style="background:${s.color}"></i>${esc(s.name)}</button>`).join("")}<button class="chip" data-act="addsub">+ Nytt fag</button></div>
      <div class="row" style="margin-top:14px"><button class="btn acc" data-act="start" style="flex:1">Start tidtaker</button><button class="btn ghost" data-act="manual">Logg i etterkant</button></div></div>`;
  }
  const diff=tm-lm;
  html+=`<div class="card"><h2>Denne uka</h2>
    <div class="stats">
      <div class="stat"><b class="mono">${hm(tm)}</b><span>studert</span></div>
      <div class="stat"><b class="mono">${thisW.length}</b><span>økter</span></div>
      <div class="stat"><b class="mono">${st}${st?" 🔥":""}</b><span>dager på rad</span></div>
    </div>
    <p class="hint">${lm||tm?(diff>=0?`${hm(diff)} mer enn forrige uke. Fortsett sånn.`:`${hm(-diff)} mindre enn forrige uke. Uka er ikke over ennå.`):pick(EMPTY_QUIPS)}</p>
    ${chart(weekBars(8))}
    <p class="hint">Studietid per uke. Oransje er denne uka.</p></div>`;
  const per={};thisW.forEach(s=>per[s.sub]=(per[s.sub]||0)+s.min);
  const tops=Object.entries(per).sort((a,b)=>b[1]-a[1]),mx=tops.length?tops[0][1]:1;
  if(tops.length)html+=`<div class="card"><h2>Fag denne uka</h2><ul class="bars">${tops.map(([id,m])=>`<li><div class="row between"><span>${esc(subj(id).name)}</span><span class="muted small">${hm(m)}</span></div><div class="bar"><b style="width:${Math.round(m/mx*100)}%;background:${subj(id).color}"></b></div></li>`).join("")}</ul></div>`;
  const recent=S.sessions.slice().sort((a,b)=>b.start-a.start).slice(0,6);
  if(recent.length)html+=`<div class="card"><h2>Siste økter</h2><ul class="list">${recent.map(s=>{
      const prev=S.sessions.filter(x=>x.sub===s.sub&&x.start<s.start),avg=prev.length?sumMin(prev)/prev.length:null,d=avg==null?null:s.min-avg;
      return `<li><div class="row between"><b>${esc(subj(s.sub).name)}</b><span class="mono">${hm(s.min)}</span></div>
        <div class="small muted">${fmtShort(new Date(s.start))}${d==null?" · første økt i faget":d>=0?` · ${hm(d)} lenger enn snittet ditt`:` · ${hm(-d)} kortere enn snittet ditt`}</div>
        ${s.read?`<div class="small" style="margin-top:4px">${esc(s.read)}</div>`:""}</li>`;}).join("")}</ul></div>`;
  html+=`<div class="row" style="margin-top:12px;justify-content:center"><button class="btn ghost small" data-act="managesub">Endre fag</button></div>`;
  return html+foot();
}
function startSub(){const on=document.querySelector("#subPick .chip.on");return on?on.dataset.v:(S.subjects[0]||{}).id;}
function sessionForm(sub,min,fromTimer){
  open(`<h3>${fromTimer?"Bra jobba.":"Logg en økt"}</h3><p class="muted" style="margin-top:0">${fromTimer?`${hm(min)} med ${esc(subj(sub).name)}. Hva fikk du gjort?`:"Glemte du tidtakeren? Skjer de beste."}</p>
   ${fromTimer?"":`<label class="f">Fag</label><select id="fSub">${S.subjects.map(s=>`<option value="${s.id}" ${s.id===sub?"selected":""}>${esc(s.name)}</option>`).join("")}</select>
   <label class="f">Minutter</label><input type="number" id="fMin" inputmode="numeric" min="1" value="45">`}
   <label class="f">Hva leste eller jobbet du med?</label><input type="text" id="fRead" placeholder="F.eks. kapittel 4, derivasjon">
   <label class="f">Punkter å huske</label><textarea id="fNotes" placeholder="Én ting per linje. Skriv «begrep: forklaring», så blir det pugge-kort automatisk.&#10;Fotosyntese: planter lager sukker av lys, CO2 og vann"></textarea>
   <p class="hint">Hver linje blir et kort under Pugg.</p>
   <div class="row" style="margin-top:16px"><button class="btn acc" data-act="savesess" data-v="${sub}" data-min="${fromTimer?Math.max(1,Math.round(min)):""}" style="flex:1">Lagre</button><button class="btn ghost" data-act="close">Avbryt</button></div>`);
}
function notesToCards(sub,txt){
  let n=0;(txt||"").split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const m=l.match(/^(.+?)\s*[:–—-]\s+(.+)$/)||l.match(/^(.+?):\s*(.+)$/);
    S.cards.push({id:uid(),sub,front:m?m[1]:l,back:m?m[2]:"",known:false,created:Date.now()});n++;});
  return n;
}

/* ---------- PUGG ---------- */
function vDrill(){
  let html=`<h1>Pugg</h1><p class="sub">Notatene dine, gjort om til kort.</p>`;
  if(!S.subjects.length)return html+`<div class="card"><p style="margin-top:0">Legg til et fag og logg en økt med punkter, så dukker kortene opp her.</p><button class="btn acc wide" data-act="addsub">Legg til fag</button></div>`+foot();
  const sub=U.drillSub||S.subjects[0].id;U.drillSub=sub;
  const cards=S.cards.filter(c=>c.sub===sub),known=cards.filter(c=>c.known).length;
  html+=`<div class="chips" style="margin-top:6px">${S.subjects.map(s=>{const n=S.cards.filter(c=>c.sub===s.id).length;return `<button class="chip ${s.id===sub?"on":""}" data-act="drillsub" data-v="${s.id}"><i style="background:${s.color}"></i>${esc(s.name)} · ${n}</button>`;}).join("")}</div>`;
  if(U.drill&&U.drill.length){
    const c=S.cards.find(x=>x.id===U.drill[0]);
    if(!c){U.drill.shift();return vDrill();}
    html+=`<div class="flash">${esc(c.front)}${U.show?`<div class="ans">${c.back?esc(c.back):"<span class='muted'>Ingen fasit her. Forklar det høyt for deg selv, og vær ærlig.</span>"}</div>`:""}</div>
      <p class="hint" style="text-align:center">${U.drill.length} kort igjen</p>
      ${U.show?`<div class="row" style="margin-top:10px"><button class="btn" style="flex:1;background:var(--ok);border-color:var(--ok);color:#fff" data-act="knew">Kunne det</button><button class="btn ghost" style="flex:1" data-act="again">Øv mer</button></div>`
             :`<button class="btn acc wide" style="margin-top:10px" data-act="reveal">Vis svar</button>`}
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost small" data-act="enddrill">Avslutt</button></div>`;
    return html+foot();
  }
  html+=`<div class="card"><h2>${esc(subj(sub).name)}</h2>
    <div class="stats"><div class="stat"><b>${cards.length}</b><span>kort</span></div><div class="stat"><b>${known}</b><span>kan du</span></div><div class="stat"><b>${cards.length-known}</b><span>igjen</span></div></div>
    ${cards.length?`<button class="btn acc wide" style="margin-top:14px" data-act="startdrill">Start pugging</button>`:`<p class="hint">Ingen kort ennå. Skriv punkter når du lagrer en økt, eller legg til et kort her.</p>`}</div>
    <div class="card"><h2>Nytt kort</h2>
      <input type="text" id="cFront" placeholder="Spørsmål eller begrep">
      <input type="text" id="cBack" placeholder="Svar eller forklaring" style="margin-top:8px">
      <button class="btn small" style="margin-top:10px" data-act="addcard">Legg til</button></div>`;
  if(cards.length)html+=`<div class="card"><h2>Alle kort</h2><ul class="list">${cards.slice().reverse().map(c=>`<li class="row between" style="flex-wrap:nowrap"><div><b>${esc(c.front)}</b>${c.back?`<div class="small muted">${esc(c.back)}</div>`:""}</div><div class="row" style="flex-wrap:nowrap">${c.known?'<span class="small" style="color:var(--ok)">✓</span>':""}<button class="x" data-act="delcard" data-v="${c.id}" aria-label="Slett kort">×</button></div></li>`).join("")}</ul></div>`;
  return html+foot();
}

/* ---------- SØNDAG ---------- */
const DRINK_DAYS=["0","1","2","3","4","5+"];
const COMPARE=[["en kinobillett",150],["en pizza levert på døra",250],["en helgetur til Barcelona",4000],["et par gode loafers",3500],["en skreddersydd dress",15000]];
function vSunday(){
  const ws=U.week,wk=iso(ws),isCur=wk===iso(monday(today()));
  const w=S.weeks[wk]||(S.weeks[wk]={});
  if(isCur&&!w.opened){w.opened=true;save();}
  const sess=sessIn(ws,addDays(ws,7)),prev=sessIn(addDays(ws,-7),ws),tm=sumMin(sess),pm=sumMin(prev);
  const per={};sess.forEach(s=>per[s.sub]=(per[s.sub]||0)+s.min);
  const top=Object.entries(per).sort((a,b)=>b[1]-a[1])[0];
  let html=`<h1>Søndagsrapporten</h1><p class="sub">Uke ${weekNo(ws)} · ${fmtShort(ws)} til ${fmtShort(addDays(ws,6))}</p>
  <div class="row between"><button class="btn ghost small" data-act="week" data-v="-1">← Forrige</button>${isCur?"":`<button class="btn ghost small" data-act="thisweek">Denne uka</button>`}<button class="btn ghost small" data-act="week" data-v="1" ${isCur?"disabled style='opacity:.3'":""}>Neste →</button></div>
  <div class="card"><h2>Ukas studier</h2><div class="big mono">${hm(tm)}</div>
    <p class="hint">${sess.length} økter${top?`. Mest tid på ${esc(subj(top[0]).name)}.`:"."} ${pm||tm?(tm>=pm?`Opp ${hm(tm-pm)} fra uka før.`:`Ned ${hm(pm-tm)} fra uka før.`):""}</p></div>
  <div class="card"><h2>Ukas dager</h2>${(()=>{const ds=[];for(let i=0;i<7;i++){const x=S.days[iso(addDays(ws,i))];if(x)ds.push(x);}
      const g=ds.reduce((t,x)=>t+(x.goals||[]).length,0),gd=ds.reduce((t,x)=>t+(x.goals||[]).filter(y=>y.done).length,0),mo=ds.filter(x=>x.mood),am=ds.filter(x=>x.sleep||x.energyAm||(x.goals||[]).length).length,pm=ds.filter(x=>x.mood||x.energyPm||x.win).length;
      const wins=ds.map(x=>x.win).filter(Boolean).slice(-3);
      if(!am&&!pm)return `<p class="hint" style="margin-top:0">Ingen dager logget denne uka. Fanen I dag tar to minutter morgen og kveld.</p>`;
      return `<div class="stats"><div class="stat"><b>${gd}/${g}</b><span>mål nådd</span></div><div class="stat"><b>${mo.length?(mo.reduce((t,x)=>t+x.mood,0)/mo.length).toFixed(1).replace(".",","):"–"}</b><span>humør i snitt</span></div><div class="stat"><b>${am}+${pm}</b><span>morgen + kveld</span></div></div>${wins.length?`<p class="small" style="margin:12px 0 4px"><b>Ukas høydepunkter</b></p><ul class="tips" style="margin-top:0">${wins.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`:""}`;})()}</div>
  <div class="card"><h2>Hvordan var uka?</h2>${scale("mood",w.mood,["Tung","Grei","Fin","God","Topp"])}
    <h2 style="margin-top:16px">Stressnivå</h2>${scale("stress",w.stress,["Zen","Lavt","Middels","Høyt","Kaos"])}</div>`;
  /* 18+ */
  if(!S.settings.adult){
    html+=`<div class="card"><h2>Helgerapporten · 18+</h2><div class="gate"><p style="margin-top:0">Denne delen handler om alkohol og røyk, og er bare for deg som er over 18.</p><button class="btn" data-act="adult">Jeg er over 18</button></div></div>`;
  }else{
    const dd=w.drinkDays, cigs=w.cigs||0, spent=Number(w.spent)||0, cigCost=cigs*(S.settings.packPrice/20), total=spent+cigCost;
    html+=`<div class="card"><h2>Helgerapporten · 18+</h2>
      <p class="q" style="margin:0 0 8px">Hvor mange dager drakk du denne uka?</p>
      <div class="chips">${DRINK_DAYS.map((l,i)=>`<button class="chip ${dd===i?"on":""}" data-act="drink" data-v="${i}">${l}</button>`).join("")}</div>
      <p style="margin:16px 0 8px">Sigaretter i helgen</p>
      <div class="step"><button data-act="cig" data-v="-1" aria-label="Færre">−</button><span class="v mono">${cigs}</span><button data-act="cig" data-v="1" aria-label="Flere">+</button><span class="small muted">≈ ${kr(cigCost)}</span></div>
      <label class="f">Brukt på byen (drikke, taxi, kebab kl. 03)</label><input type="number" inputmode="numeric" data-bind="spent" value="${esc(w.spent||"")}" placeholder="0">
      ${total>0?`<div class="money"><div class="small muted">Helgen kostet</div><div class="big mono">${kr(total)}</div>
        <div class="small" style="margin-top:6px">Gjør du dette hver helg, blir det <b>${kr(total*52)}</b> i året. Det er:</div>
        <ul class="cmp">${COMPARE.map(([t,p])=>{const n=total*52/p;return `<li><span>${t}</span><b class="mono">${n>=10?Math.round(n):n.toFixed(1).replace(".",",")} stk</b></li>`;}).join("")}</ul>
        <p class="hint">Priser er omtrentlige. Røyk regnes med ${kr(S.settings.packPrice)} per pakke, som du kan endre i innstillinger.</p></div>`:""}
      ${dd>0?hangover():""}
      ${challenge(w,dd,cigs)}
    </div>`;
  }
  html+=`<div class="card"><h2>Påminnelse hver søndag</h2><p style="margin-top:0">Appen kan ikke sende meldinger selv. Legg inn en fast påminnelse i kalenderen, så får du et varsel hver søndag kl. 18.</p><button class="btn wide" data-act="ics">Legg til i kalenderen</button></div>`;
  return html+foot();
}
function scale(f,val,labels){return `<div class="scale">${labels.map((l,i)=>`<button class="${val===i+1?"on":""}" data-act="scale" data-f="${f}" data-v="${i+1}" aria-pressed="${val===i+1}" title="${l}">${i+1}</button>`).join("")}</div><div class="row between small muted" style="margin-top:4px"><span>${labels[0]}</span><span>${val?labels[val-1]:""}</span><span>${labels[4]}</span></div>`;}
function hangover(){
  return `<div class="card" style="margin:12px 0 0;background:var(--gold-soft);border-color:var(--gold)"><h2 style="color:inherit">Dagen derpå</h2>
    <p style="margin:0">Ærlig talt: det finnes ingen kur. Bare tid. Men dette gjør ventetiden bedre.</p>
    <ul class="tips">
      <li><b>Vann, og mer vann.</b> Gjerne noe salt ved siden av, som buljong eller suppe.</li>
      <li><b>Varm, salt og litt sterk mat.</b> Nudelsuppe, ramen, eggerøre på toast. Mange kokker sverger til noe varmt og krydret og noe iskaldt å drikke. Anthony Bourdain var en av dem.</li>
      <li><b>Banan eller appelsinjuice</b> for kroppen, som har vært gjennom en del.</li>
      <li><b>Frisk luft og en rolig tur.</b> Det fikser ikke bakfyllen, men det fikser humøret.</li>
      <li><b>Sov.</b> Sofaen er lov i dag.</li>
    </ul>
    <p class="hint">Vær forsiktig med smertestillende etter mye alkohol, spesielt paracetamol. Spør på apoteket hvis du er usikker.</p></div>`;
}
function challenge(w,dd,cigs){
  let t,why;
  if(cigs>0||dd>=2){t="Gå 5 km ute i dag";why="Ikke som straff. Fordi frisk luft er gratis, og du kommer til å føle deg bedre etterpå.";}
  else if(dd===1){t="Gå en tur på 30 minutter";why="Én kveld ute, én tur ute. Balanse.";}
  else{t="Hold det gående: 30 minutter bevegelse";why="Rolig helg? Da har du overskudd. Bruk det.";}
  return `<div class="challenge"><div class="small muted">Ukas utfordring</div><b>${t}</b><p class="small" style="margin:6px 0 10px">${why}</p>
    ${w.chDone?`<div class="sealrow">${SEAL()}<p>Gjort. Stilig.</p></div><button class="btn small ghost" style="margin-top:10px" data-act="chdone">Angre</button>`:`<button class="btn small" data-act="chdone">Merk som gjort</button>`}</div>`;
}

function download(name,txt,type){try{const b=new Blob([txt],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();return true;}catch(e){return false;}}
function backup(){const txt=JSON.stringify(S);const ok=download("scaff-kopi-"+iso(today())+".json",txt,"application/json");
  open(`<h3>Sikkerhetskopi</h3><p class="muted">${ok?"Filen lastes ned. ":""}Kom ingen fil? Merk og kopier teksten under, og send den til deg selv.</p><textarea readonly onclick="this.select()" style="font-family:ui-monospace,Menlo,monospace;font-size:12px">${esc(txt)}</textarea><button class="btn wide" style="margin-top:12px" data-act="close">Ferdig</button>`);}
function restore(){open(`<h3>Hent inn kopi</h3><p class="muted">Det som ligger i appen nå, blir erstattet.</p>
  <label class="btn ghost" for="impFile">Velg fil</label><input type="file" id="impFile" accept=".json,application/json,text/plain" style="display:none">
  <textarea id="impText" placeholder="Eller lim inn teksten her" style="margin-top:10px"></textarea>
  <div class="row" style="margin-top:12px"><button class="btn" data-act="doimport">Hent inn</button><button class="btn ghost" data-act="close">Avbryt</button></div>`);}
function doImport(txt){let d;try{d=JSON.parse(txt);}catch(e){toast("Det der ser ikke ut som en kopi");return;}
  if(!d||!Array.isArray(d.sessions)){toast("Fant ingen data i kopien");return;}
  S=Object.assign(blank(),d);S.settings=Object.assign(blank().settings,d.settings||{});save();close();render();toast("Kopien er hentet inn");}
function ics(){
  let d=today();while(d.getDay()!==0)d=addDays(d,1);
  const dt=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T180000";
  const url=location.href.split("?")[0];
  const txt=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Scaff//NO","BEGIN:VEVENT","UID:"+uid()+"@scaff","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",
    "DTSTART:"+dt,"DURATION:PT15M","RRULE:FREQ=WEEKLY;BYDAY=SU","SUMMARY:Søndagsrapporten i Scaff","DESCRIPTION:Se hvordan uka di ble: "+url,"URL:"+url,
    "BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:Søndagsrapporten er klar","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const ok=download("scaff-sondag.ics",txt,"text/calendar");
  toast(ok?"Åpne filen for å legge den i kalenderen":"Fikk ikke lastet ned filen");
}

/* ---------- klikk ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==="tab"){U.view=v;U.drill=null;render();window.scrollTo(0,0);return;}
  if(a==="settings"){settings();return;}
  if(a==="close"){close();return;}
  /* i dag */
  if(a==="part"){U.part=v;render();window.scrollTo(0,0);return;}
  if(a==="day"){const n=addDays(U.day,+v);if(n<=today()){U.day=n;U.part=null;render();}return;}
  if(a==="gotoday"){U.day=today();U.part=null;render();return;}
  if(a==="goday"){U.day=parse(v);U.part=null;render();window.scrollTo(0,0);return;}
  if(a==="dscale"){const d=dayData(iso(U.day)),f=b.dataset.f,n=+v;d[f]=d[f]===n?undefined:n;save();render();return;}
  if(a==="gadd"){const i=document.getElementById("gIn"),t=i&&i.value.trim();if(!t){toast("Skriv et mål først");return;}const d=dayData(iso(U.day));if(d.goals.length>=5)return;d.goals.push({t,done:false});save();render();const n=document.getElementById("gIn");if(n)n.focus();return;}
  if(a==="gdel"){const d=dayData(iso(U.day));d.goals.splice(+v,1);save();render();return;}
  if(a==="gdone"){const d=dayData(iso(U.day)),g=d.goals[+v];g.done=!g.done;save();render();if(g.done&&d.goals.every(x=>x.done))toast("Alle mål nådd. Elegant.");return;}
  if(a==="gmove"){const d=dayData(iso(U.day)),t=dayData(iso(addDays(U.day,1)));const left=d.goals.filter(g=>!g.done);left.forEach(g=>{if(t.goals.length<5&&!t.goals.some(x=>x.t===g.t))t.goals.push({t:g.t,done:false});});save();render();toast(`${left.length} mål flyttet til i morgen`);return;}
  /* fag */
  if(a==="addsub"){addSub();return;}
  if(a==="pickcol"){document.querySelectorAll("#sCol .chip").forEach(c=>c.classList.toggle("on",c===b));return;}
  if(a==="savesub"){const n=document.getElementById("sName").value.trim();if(!n){toast("Faget trenger et navn");return;}
    const c=(document.querySelector("#sCol .chip.on")||{}).dataset;S.subjects.push({id:uid(),name:n,color:c?c.v:COLORS[0]});save();close();render();toast(`${n} er lagt til`);return;}
  if(a==="managesub"){manageSub();return;}
  if(a==="delsub"){if(!confirm("Slette faget med alle økter og kort?"))return;S.subjects=S.subjects.filter(s=>s.id!==v);S.sessions=S.sessions.filter(s=>s.sub!==v);S.cards=S.cards.filter(c=>c.sub!==v);if(S.timer&&S.timer.sub===v)S.timer=null;if(U.drillSub===v)U.drillSub=null;save();manageSub();render();return;}
  /* økter */
  if(a==="pickstart"){document.querySelectorAll("#subPick .chip").forEach(c=>c.classList.toggle("on",c===b));return;}
  if(a==="start"){S.timer={sub:startSub(),startedAt:Date.now()};save();render();toast("Klokken går. Lykke til.");return;}
  if(a==="cancel"){if(!confirm("Avbryte økta uten å lagre?"))return;S.timer=null;save();render();return;}
  if(a==="stop"){const t=S.timer;const m=elapsedMin();if(m<1){toast("Under ett minutt teller dessverre ikke");return;}sessionForm(t.sub,m,true);return;}
  if(a==="manual"){sessionForm(startSub(),45,false);return;}
  if(a==="savesess"){
    const sub=document.getElementById("fSub")?document.getElementById("fSub").value:v;
    const min=b.dataset.min?+b.dataset.min:Math.max(1,+(document.getElementById("fMin").value||0));
    if(!min){toast("Skriv inn antall minutter");return;}
    const start=b.dataset.min&&S.timer?S.timer.startedAt:Date.now()-min*60000;
    const read=document.getElementById("fRead").value.trim(),notes=document.getElementById("fNotes").value;
    S.sessions.push({id:uid(),sub,start,min,read});
    const n=notesToCards(sub,notes);
    if(b.dataset.min)S.timer=null;
    save();close();render();toast(n?`Lagret, og ${n} nye pugge-kort`:"Lagret. Fremtidige deg sier takk.");return;}
  /* pugg */
  if(a==="drillsub"){U.drillSub=v;U.drill=null;render();return;}
  if(a==="addcard"){const f=document.getElementById("cFront").value.trim(),bk=document.getElementById("cBack").value.trim();if(!f){toast("Kortet trenger et spørsmål");return;}
    S.cards.push({id:uid(),sub:U.drillSub,front:f,back:bk,known:false,created:Date.now()});save();render();toast("Kortet er lagt til");return;}
  if(a==="delcard"){S.cards=S.cards.filter(c=>c.id!==v);save();render();return;}
  if(a==="startdrill"){const cs=S.cards.filter(c=>c.sub===U.drillSub);const todo=cs.filter(c=>!c.known),done=cs.filter(c=>c.known);
    const sh=x=>x.map(c=>[Math.random(),c.id]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);U.drill=sh(todo).concat(sh(done));U.show=false;render();return;}
  if(a==="reveal"){U.show=true;render();return;}
  if(a==="knew"||a==="again"){const id=U.drill.shift(),c=S.cards.find(x=>x.id===id);if(c){c.known=a==="knew";if(a==="again")U.drill.push(id);}save();U.show=false;
    if(!U.drill.length){U.drill=null;toast("Ferdig med bunken. Hjernen din er stolt.");}render();return;}
  if(a==="enddrill"){U.drill=null;render();return;}
  /* søndag */
  if(a==="week"){const n=addDays(U.week,7*+v);if(n<=monday(today())){U.week=n;render();}return;}
  if(a==="thisweek"){U.week=monday(today());render();return;}
  if(a==="scale"){const w=S.weeks[iso(U.week)];const n=+v;w[b.dataset.f]=w[b.dataset.f]===n?undefined:n;save();render();return;}
  if(a==="adult"){S.settings.adult=true;save();render();return;}
  if(a==="hideadult"){S.settings.adult=false;save();close();render();return;}
  if(a==="drink"){const w=S.weeks[iso(U.week)];w.drinkDays=w.drinkDays===+v?undefined:+v;save();render();return;}
  if(a==="cig"){const w=S.weeks[iso(U.week)];w.cigs=Math.max(0,(w.cigs||0)+ +v);save();render();return;}
  if(a==="chdone"){const w=S.weeks[iso(U.week)];w.chDone=!w.chDone;save();render();if(w.chDone)toast("Stilig.");return;}
  if(a==="ics"){ics();return;}
  /* innstillinger */
  if(a==="theme"){if(v==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",v);try{localStorage.setItem(KEY+".theme",v);}catch(x){}
    document.querySelectorAll('[data-act="theme"]').forEach(c=>c.classList.toggle("on",c===b));return;}
  if(a==="savesettings"){const p=+document.getElementById("pack").value;if(p>0)S.settings.packPrice=p;save();close();render();return;}
  if(a==="backup"){backup();return;}
  if(a==="restore"){restore();return;}
  if(a==="doimport"){const t=document.getElementById("impText");if(t&&t.value.trim())doImport(t.value.trim());else toast("Velg en fil eller lim inn teksten");return;}
  if(a==="howto"){howto();return;}
  if(a==="askwipe"){open(`<h3>Slette alt?</h3><p class="muted">Fag, økter, kort og søndagsrapporter forsvinner fra denne telefonen. Det kan ikke angres.</p><div class="row"><button class="btn danger" data-act="wipe">Slett alt</button><button class="btn ghost" data-act="close">Avbryt</button></div>`);return;}
  if(a==="wipe"){S=blank();save();close();U.view="today";render();toast("Alt er slettet");return;}
});
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")close();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close();if(e.key==="Enter"&&e.target.id==="gIn"){const b=document.querySelector('[data-act="gadd"]');if(b)b.click();}});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset&&el.dataset.dbind){dayData(iso(U.day))[el.dataset.dbind]=el.value;save();}});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset&&el.dataset.bind==="spent"){S.weeks[iso(U.week)].spent=el.value;save();clearTimeout(window._sp);window._sp=setTimeout(render,900);}});
document.addEventListener("change",e=>{if(e.target.id==="impFile"&&e.target.files&&e.target.files[0]){const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(e.target.files[0]);}});
try{const t=localStorage.getItem(KEY+".theme");if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t);}catch(e){}

/* ---------- oppdateringssjekk ---------- */
const MY_VER=(document.querySelector('meta[name="app-version"]')||{}).content||"";let updShown=false;
function checkUpdate(){if(updShown||!/^https?:/.test(location.protocol)||!window.fetch)return;
  fetch(location.pathname+"?sjekk="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{const m=t.match(/<meta name="app-version" content="([^"]+)"/);
    if(m&&m[1]&&m[1]!==MY_VER){updShown=true;const el=document.getElementById("upd");el.dataset.v=m[1];el.classList.add("show");}}).catch(()=>{});}
document.getElementById("upd").addEventListener("click",e=>{if(!e.target.closest("button"))return;save();location.replace(location.pathname+"?v="+encodeURIComponent(document.getElementById("upd").dataset.v||Date.now()));});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){checkUpdate();if(U.view==="study"&&S.timer)render();}});
setTimeout(checkUpdate,1500);

if(today().getDay()===0&&!(S.weeks[iso(monday(today()))]||{}).opened&&S.subjects.length)U.view="sunday";
render();
})();
</script>
</body>
